[book]
title = "The Terra RFC Book"

[output.html]
smart-punctuation = true
no-section-label = true
git-repository-url = "https://github.com/terrapkg/rfcs/"
site-url = ""
edit-url-template = "https://github.com/terrapkg/rfcs/edit/main/text/{path}"

[output.html.search]
heading-split-level = 0

[output.html.playground]
runnable = false

[build]
extra-watch-dirs = ["text"]
